
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic_trf"
version = "2.0.2"
authors = [
    { name = "Powerfulbean", email = "powerfulbean@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=2.0.0",
    "matplotlib",
    "statsmodels",
    "tqdm",
    "pytour",
    "mtrf",
    "nntrf",
]

[tool.hatch.build.targets.wheel]
packages = ["dynamic_trf"]
